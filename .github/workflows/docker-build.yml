name: Linux Docker build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the complete project and run runtime QA
        run: docker build --pull --progress=plain --tag gr-hydra:ci .
      - name: Run runtime QA as the image's non-root user
        run: docker run --rm gr-hydra:ci
